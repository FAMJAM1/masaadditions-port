modLoader = "javafml"
loaderVersion = "[4,)"
license = "GPL-3.0"
issueTrackerURL = "https://github.com/FAMJAM1/masaadditions-port/issues"

[[mods]]
modId = "masaadditions"
version = "${version}"
displayName = "MasaAdditions"
displayURL = "https://github.com/FAMJAM1/masaadditions-port"
description = "Unofficial NeoForge port of MasaAdditions, an add-on for masa's Tweakeroo, MiniHUD and Litematica."
authors = "FAMJAM"
credits = "hp3721"
logoFile = "masaadditions-icon.png"

[[dependencies.masaadditions]]
    modId = "neoforge"
    type = "required"
    versionRange = "[21.11,)"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.masaadditions]]
    modId = "minecraft"
    type = "required"
    versionRange = "[1.21.11,1.21.12)"
    ordering = "NONE"
    side = "CLIENT"

# 0.4.5 hooks a call the game no longer makes inside Language.loadFromJson, which
# NeoForge rerouted, and the game dies on it. The gap holds that release out
[[dependencies.masaadditions]]
    modId = "mafglib"
    type = "required"
    versionRange = "[0.4,0.4.5),[0.4.6,)"
    ordering = "NONE"
    side = "CLIENT"

# 0.4.3 needs a malilib class that arrived only in MaFgLib 0.4.5, and that release
# is held out above, so the pair cannot be satisfied. The gap holds it out too
[[dependencies.masaadditions]]
    modId = "forgematica"
    type = "optional"
    versionRange = "[0.4,0.4.3),[0.4.4,)"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.masaadditions]]
    modId = "tweakerge"
    type = "optional"
    versionRange = "[0.4,)"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.masaadditions]]
    modId = "bocchud"
    type = "optional"
    versionRange = "[0.4,)"
    ordering = "NONE"
    side = "CLIENT"

# Mixin configs are declared here; the MixinConfigs manifest attribute is not read
[[mixins]]
    config = "masaadditions.tweakeroo_additions.tweakeroo_mixin.json"

[[mixins]]
    config = "masaadditions.tweakeroo_additions.mixin.json"

[[mixins]]
    config = "masaadditions.minihud_additions.minihud_mixin.json"

[[mixins]]
    config = "masaadditions.minihud_additions.mixin.json"

[[mixins]]
    config = "masaadditions.litematica_additions.litematica_mixin.json"

[[mixins]]
    config = "masaadditions.litematica_additions.mixin.json"

