modLoader = "javafml"
loaderVersion = "[4,)"
license = "GPL-3.0"
issueTrackerURL = "https://github.com/FAMJAM1/masaadditions-port/issues"

[[mods]]
modId = "masaadditions"
version = "${version}"
displayName = "MasaAdditions"
displayURL = "https://github.com/FAMJAM1/masaadditions-port"
description = "Unofficial NeoForge port of MasaAdditions, an add-on for masa's Tweakeroo, MiniHUD and Litematica."
authors = "FAMJAM"
logoFile = "masaadditions-icon.png"

[[dependencies.masaadditions]]
    modId = "neoforge"
    type = "required"
    versionRange = "[21.1,21.2)"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.masaadditions]]
    modId = "minecraft"
    type = "required"
    versionRange = "[1.21.1,1.21.2)"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.masaadditions]]
    modId = "mafglib"
    type = "required"
    versionRange = "[0.4,)"
    ordering = "NONE"
    side = "CLIENT"

# 0.4.2 ships an access widener for BufferBuilder.building, a Fabric format that
# nothing on 1.21.1 can apply, and schematic rendering dies on the field being
# private. The gap holds that one release out whilst leaving later ones welcome
[[dependencies.masaadditions]]
    modId = "forgematica"
    type = "optional"
    versionRange = "[0.3,0.4.2),[0.4.3,)"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.masaadditions]]
    modId = "tweakerge"
    type = "optional"
    versionRange = "[0.3,)"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.masaadditions]]
    modId = "bocchud"
    type = "optional"
    versionRange = "[0.3,)"
    ordering = "NONE"
    side = "CLIENT"
