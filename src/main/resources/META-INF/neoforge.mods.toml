modLoader = "javafml"
loaderVersion = "[4,)"
license = "GPL-3.0"
issueTrackerURL = "https://github.com/FAMJAM1/masaadditions-port/issues"

[[mods]]
modId = "masaadditions"
version = "${version}"
displayName = "MasaAdditions"
displayURL = "https://github.com/FAMJAM1/masaadditions-port"
description = "Unofficial NeoForge port of MasaAdditions, an add-on for masa's Tweakeroo, MiniHUD and Litematica."
authors = "FAMJAM"
credits = "hp3721"
logoFile = "masaadditions-icon.png"

[[dependencies.masaadditions]]
    modId = "neoforge"
    type = "required"
    versionRange = "[21.10,21.11)"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.masaadditions]]
    modId = "minecraft"
    type = "required"
    versionRange = "[1.21.10,1.21.11)"
    ordering = "NONE"
    side = "CLIENT"

# The four below are each pinned to the oldest release of their 1.21.10 line that
# this was built and checked against. Their method signatures move from release to
# release, so an older one would load and then miss its hooks
[[dependencies.masaadditions]]
    modId = "mafglib"
    type = "required"
    versionRange = "[0.4.9,)"
    ordering = "NONE"
    side = "CLIENT"

# 0.4.5 ships this line with its metadata URLs left as build placeholders, and
# the loader rejects the file outright before any mod gets to load. The gap holds
# it out and leaves room for a fix above
[[dependencies.masaadditions]]
    modId = "forgematica"
    type = "optional"
    versionRange = "[0.4.3,0.4.5),[0.4.6,)"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.masaadditions]]
    modId = "tweakerge"
    type = "optional"
    versionRange = "[0.4.2,)"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.masaadditions]]
    modId = "bocchud"
    type = "optional"
    versionRange = "[0.4.3,)"
    ordering = "NONE"
    side = "CLIENT"

# Mixin configs are declared here; the MixinConfigs manifest attribute is not read
[[mixins]]
    config = "masaadditions.tweakeroo_additions.tweakeroo_mixin.json"

[[mixins]]
    config = "masaadditions.tweakeroo_additions.mixin.json"

[[mixins]]
    config = "masaadditions.minihud_additions.minihud_mixin.json"

[[mixins]]
    config = "masaadditions.minihud_additions.mixin.json"

[[mixins]]
    config = "masaadditions.litematica_additions.litematica_mixin.json"

[[mixins]]
    config = "masaadditions.litematica_additions.mixin.json"

