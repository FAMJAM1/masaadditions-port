plugins {
    // no-remap: from 26.1 on, masa's NeoForge ports are compiled straight against
    // Mojang names, so there is nothing left to remap
    id 'dev.architectury.loom-no-remap' version '1.17.491'
    id 'maven-publish'
}

String mod_version = "${mod_base_version}+${mod_version_meta}"

base {
    archivesName = project.archives_base_name
    version = mod_version
    group = project.maven_group
}

loom {
    accessWidenerPath = file("src/main/resources/masaadditions.accesswidener")
    neoForge {}
}

repositories {
    maven { url = "https://maven.neoforged.net/releases" }
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.architectury.dev/" }
    maven { url = 'https://api.modrinth.com/maven' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // No mappings: the game ships unobfuscated from 26.1 on
    neoForge "net.neoforged:neoforge:${project.neoforge_version}"

    // The mods this one extends. Compile only: the player installs them separately
    compileOnly "maven.modrinth:mafglib:${project.mafglib_version}"
    compileOnly "maven.modrinth:forgematica:${project.forgematica_version}"
    compileOnly "maven.modrinth:tweakerge:${project.tweakerge_version}"
    compileOnly "maven.modrinth:bocchud:${project.bocchud_version}"

    runtimeOnly "maven.modrinth:mafglib:${project.mafglib_version}"
    runtimeOnly "maven.modrinth:forgematica:${project.forgematica_version}"
    runtimeOnly "maven.modrinth:tweakerge:${project.tweakerge_version}"
    runtimeOnly "maven.modrinth:bocchud:${project.bocchud_version}"
    runtimeOnly "maven.modrinth:foxifiedclasstweaker:${project.foxified_classtweaker_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    // Minecraft 26.1+ runs on Java 25
    it.options.release = 25
    // Default is 100, which hides how much of the port is left
    it.options.compilerArgs << '-Xmaxerrs' << '2000'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

jar {
    from "LICENSE"
}
