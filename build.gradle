plugins {
    // 1.21.8 still ships obfuscated, so the real plugin is needed: it remaps
    // this mod on the way out and masa's mods on the way in
    id 'dev.architectury.loom' version '1.17.491'
    id 'maven-publish'
}

String mod_version = "${mod_base_version}+${mod_version_meta}"

base {
    archivesName = project.archives_base_name
    version = mod_version
    group = project.maven_group
}

loom {
    accessWidenerPath = file("src/main/resources/masaadditions.accesswidener")
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.architectury.dev/" }
    maven { url = 'https://api.modrinth.com/maven' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Mojang names, not yarn: the source came from the 26.1 branch, which is
    // written in them, and loom remaps masa's mods to match on the way in
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // The mods this one extends. Compile only: the player installs them separately
    modCompileOnly "maven.modrinth:malilib:${project.malilib_version}"
    modCompileOnly "maven.modrinth:litematica:${project.litematica_version}"
    modCompileOnly "maven.modrinth:tweakeroo:${project.tweakeroo_version}"
    modCompileOnly "maven.modrinth:minihud:${project.minihud_version}"

    modRuntimeOnly "maven.modrinth:malilib:${project.malilib_version}"
    modRuntimeOnly "maven.modrinth:litematica:${project.litematica_version}"
    modRuntimeOnly "maven.modrinth:tweakeroo:${project.tweakeroo_version}"
    modRuntimeOnly "maven.modrinth:minihud:${project.minihud_version}"
    // malilib needs the networking and resource loader modules
    modRuntimeOnly "maven.modrinth:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    // Minecraft 1.21.8 runs on Java 21
    it.options.release = 21
    // Default is 100, which hides how much of the port is left
    it.options.compilerArgs << '-Xmaxerrs' << '2000'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

jar {
    from "LICENSE"
}
