plugins {
    // no-remap: from 26.1 on the game ships unobfuscated and masa's mods are
    // compiled straight against Mojang names, so there is nothing left to remap
    id 'dev.architectury.loom-no-remap' version '1.17.491'
    id 'maven-publish'
}

String mod_version = "${mod_base_version}+${mod_version_meta}"

base {
    archivesName = project.archives_base_name
    version = mod_version
    group = project.maven_group
}

loom {
    accessWidenerPath = file("src/main/resources/masaadditions.accesswidener")
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.architectury.dev/" }
    maven { url = 'https://api.modrinth.com/maven' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // No mappings: the game ships unobfuscated from 26.1 on. loom-no-remap does
    // not register the mod* configurations either, so these are plain ones
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // The mods this one extends. Compile only: the player installs them separately
    compileOnly "maven.modrinth:malilib:${project.malilib_version}"
    compileOnly "maven.modrinth:litematica:${project.litematica_version}"
    compileOnly "maven.modrinth:tweakeroo:${project.tweakeroo_version}"
    compileOnly "maven.modrinth:minihud:${project.minihud_version}"

    runtimeOnly "maven.modrinth:malilib:${project.malilib_version}"
    runtimeOnly "maven.modrinth:litematica:${project.litematica_version}"
    runtimeOnly "maven.modrinth:tweakeroo:${project.tweakeroo_version}"
    runtimeOnly "maven.modrinth:minihud:${project.minihud_version}"
    // malilib needs the networking and resource loader modules
    runtimeOnly "maven.modrinth:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    // Minecraft 26.1+ runs on Java 25
    it.options.release = 25
    // Default is 100, which hides how much of the port is left
    it.options.compilerArgs << '-Xmaxerrs' << '2000'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

jar {
    from "LICENSE"
}
