org.gradle.jvmargs=-Xmx3G
loom.platform=fabric

# Game
minecraft_version=1.21.8
loader_version=0.19.3

# Mod. The jar is named <base>+<meta>: bump base for fixes, meta when the game
# version line or loader changes. The meta names the supported line, not the one
# it was built against: minecraft_version above is what the build compiles with
mod_base_version=1.3.0
mod_version_meta=1.21.8.fabric
maven_group=com.red.masaadditions
archives_base_name=MasaAdditions

# The mods this one extends
malilib_version=0.25.7
litematica_version=0.23.7
tweakeroo_version=0.25.6
minihud_version=0.36.7
fabric_api_version=0.136.1+1.21.8
