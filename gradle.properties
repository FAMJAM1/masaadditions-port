org.gradle.jvmargs=-Xmx3G
loom.platform=neoforge

# Minecraft
minecraft_version=26.1.2
neoforge_version=26.1.2.95

# Mod. The jar is named <base>+<meta>: bump base for fixes, meta when the game
# version line or loader changes. The meta names the supported line, not the one
# it was built against: minecraft_version below is what the build compiles with
mod_base_version=1.1.14
mod_version_meta=26.1.x.neoforge
maven_group=com.red.masaadditions
archives_base_name=MasaAdditions

# NeoForge ports of masa's mods: malilib, litematica, tweakeroo, minihud
mafglib_version=0.5.5+mc26.1.2
forgematica_version=0.5.1+mc26.1.2
tweakerge_version=0.5.0+mc26.1.2
bocchud_version=0.5.1+mc26.1.2

# Access wideners on 26.1+ go through this instead of the loader
foxified_classtweaker_version=0.1.0-alpha.4
